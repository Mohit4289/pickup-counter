version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pickup_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pickup_counter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pickup_counter"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pickup_backend
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pickup_counter
      WEBHOOK_SECRET: secret_pickup_counter_2026
      ORDER_HOLD_DURATION_SECONDS: 120
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pickup_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
